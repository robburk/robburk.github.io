    <a href="index.html" class="logo"><img src="assets/logo.png" alt="RRB"></a>

      <li><a href="governance.html">DIGITAL GOVERNANCE</a></li>

    <a href="governance.html">DIGITAL GOVERNANCE</a>

    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </div>
  <main>
    <div class="page-hero">
      <div class="page-eyebrow">GET IN TOUCH</div>
      <h1 class="page-title">CONTACT.</h1>
    </div>
    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="form-group">
        <label>NAME</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>ORGANIZATION</label>
        <input type="text" name="organization">
      </div>
      <div class="form-group">
        <label>WHAT DO YOU NEED HELP WITH?</label>
        <select name="service">
          <option value="">Select one</option>
          <option>Platform Governance (Meta / Google / TikTok)</option>
          <option>Asset Recovery</option>
          <option>Tracking Diagnostics</option>
          <option>NGO / Nonprofit Compliance</option>
          <option>Google Ad Grants</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="form-group">
        <label>TELL ME MORE</label>
        <textarea name="message" placeholder="Brief description of what's broken or what you need..."></textarea>
      </div>
      <button type="submit" class="form-submit">SEND MESSAGE &rarr;</button>
    </form>
  </main>
  <footer>
    <span>© 2026 Robin Richard Burkhardt</span>
    <span>robinburkhardt.com</span>
  </footer>
  <script src="main.js"></script>
</body>
